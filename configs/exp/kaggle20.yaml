# Compute-limited study: 20 evenly spaced CUB classes, 3 open generators, free Kaggle T4s.
# Reduced scope by necessity; the paper must say so. See RESULTS_STATUS.md.
dataset:
  name: cub
  max_classes: 20
  alignment_k: 5
prompts:
  regimes: [P1, P2]
generation:
  families: [sd15, sdturbo, sdxl]
  seeds: [0]
  images_per_class_multiplier: 3
  steps: 25
  guidance: 2.0
  batch_size: 8
  save_format: jpg
features:
  primary: dinov2
  secondary: clip
  selection: clip
selection:
  seeds: [0, 1, 2]
